<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account | User Validation System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="card-header">
        <div class="app-badge">📝 New User Provisioning</div>
        <h1>Create Account</h1>
        <p>Register new credentials directly into the database</p>
      </div>

      {{ERROR_MESSAGE}}
      {{SUCCESS_MESSAGE}}

      <form action="/register" method="POST">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">🪪</span>
            <input 
              type="text" 
              id="fullName" 
              name="fullName" 
              class="form-control" 
              placeholder="e.g. Swastik Sharma" 
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="username">Desired Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-control" 
              placeholder="e.g. swastik2026" 
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔑</span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="Minimum 6 characters" 
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <div class="input-wrapper">
            <span class="input-icon">💼</span>
            <input 
              type="text" 
              id="role" 
              name="role" 
              class="form-control" 
              value="Software Engineer" 
              required
            >
          </div>
        </div>

        <button type="submit" class="btn btn-primary">
          Register to Database →
        </button>
      </form>

      <div class="card-footer">
        Already registered in the database? <a href="/login">Sign In here</a>
      </div>
    </div>
  </div>

</body>
</html>
